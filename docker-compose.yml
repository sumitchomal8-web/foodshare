version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: foodshare-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=foodshare

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodshare-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - DB_NAME=foodshare
      - SECRET_KEY=b9c47e82649a37452d763bc18084a921d1e43b876a91345678abcdef01234567
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodshare-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
