[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bhuvnesh9414-arch", email = "bhuvnesh9414@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "motor>=3.7.1",
    "passlib[bcrypt]>=1.9.5",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-jose[cryptography]>=3.5.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:asyncio"

