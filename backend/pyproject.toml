[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sumitchomal8-web", email = "sumitchomal8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "motor>=3.7.1",
    "passlib>=1.7.4",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
